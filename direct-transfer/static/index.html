<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Audio | Dark Mode</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#8b5cf6">
    <meta name="description" content="WebRTC Audio Streaming Application">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Audio Stream">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --transition: all 0.3s ease;
            
            /* Light mode colors */
            --bg-color: #ffffff;
            --text-color: #000000;
            --text-muted: rgba(0, 0, 0, 0.5);
            --text-light: rgba(0, 0, 0, 0.3);
            --icon-color: #000000;
            --hover-bg: rgba(0, 0, 0, 0.1);
            --bar-color: #000000;
            --square-color: #000000;
            --button-bg: #000000;
            --button-text: #ffffff;
            --scrollbar-thumb: rgba(0, 0, 0, 0.1);
            --scrollbar-thumb-hover: rgba(0, 0, 0, 0.2);
        }

        [data-theme="dark"] {
            /* Dark mode colors */
            --bg-color: #000000;
            --text-color: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.5);
            --text-light: rgba(255, 255, 255, 0.3);
            --icon-color: #ffffff;
            --bar-color: #ffffff;
            --square-color: #ffffff;
            --button-bg: #ffffff;
            --button-text: #000000;
            --scrollbar-thumb: rgba(255, 255, 255, 0.1);
            --scrollbar-thumb-hover: rgba(255, 255, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            background: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            transition: var(--transition);
        }

        .ai-voice-container {
            width: 100%;
            max-width: 576px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            flex-direction: column;
            gap: 8px;
            padding: 16px;
        }

        .control-row {
            display: flex;
            gap: 8px;
            align-items: center;
            width: 100%;
            justify-content: center;
            text-align: center;
        }

        .mute-button {
            padding: 6px 10px;
            border-radius: 999px;
            border: 1px solid var(--text-light);
            background: transparent;
            color: var(--text-color);
            cursor: pointer;
            transition: var(--transition);
            font-weight: 600;
            font-size: 12px;
            line-height: 1;
            opacity: 0.85;
        }

        .mute-button.active {
            background: var(--button-bg);
            color: var(--button-text);
            border-color: transparent;
            opacity: 1;
        }

        .mute-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
            opacity: 1;
        }

        .mic-button {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            cursor: pointer;
            border: none;
            background: transparent;
            position: relative;
            overflow: hidden;
        }


        .mic-icon {
            width: 20px;
            height: 20px;
            opacity: 0.7;
            stroke: var(--icon-color);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: var(--transition);
        }

        .recording-square {
            width: 16px;
            height: 16px;
            border-radius: 2px;
            background: var(--square-color);
            animation: spin 3s linear infinite;
            cursor: pointer;
            opacity: 0.9;
        }

        .timer {
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 13px;
            transition: opacity 0.3s;
            opacity: 0.7;
            min-height: 18px;
            display: flex;
            align-items: center;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .timer.recording {
            opacity: 0.9;
            color: var(--text-color);
        }

        .timer.idle {
            opacity: 0.3;
            color: var(--text-light);
        }

        .visualizer-container {
            height: 16px;
            width: 256px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1px;
            margin: 4px 0;
        }

        .visualizer-bar {
            width: 1.5px;
            border-radius: 999px;
            transition: all 0.2s ease;
            background: var(--bar-color);
            height: 2px;
            opacity: 0.15;
            flex-shrink: 0;
        }

        .visualizer-bar.recording {
            opacity: 0.6;
            animation: none;
        }

        .status-text {
            height: 16px;
            font-size: 11px;
            opacity: 0.5;
            display: flex;
            align-items: center;
            font-weight: 400;
            margin-top: 2px;
            color: var(--text-muted);
        }

        .audio-container {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            z-index: 1000;
            display: none; /* Hide completely by default */
        }

        .audio-container audio {
            width: 100%;
            border-radius: 8px;
            display: none; /* Hide the audio element completely */
        }

        .hidden {
            display: none;
        }

        #installButton {
            display: none;
            background-color: var(--button-bg);
            color: var(--button-text);
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: var(--transition);
        }

        #themeToggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: transparent;
            border: 1px solid var(--text-light);
            color: var(--text-color);
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #themeToggle:hover {
        }

        .theme-icon {
            width: 16px;
            height: 16px;
            stroke: var(--text-color);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        #installButton:hover {
            transform: scale(1.04);
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Dark mode scrollbar */
        ::-webkit-scrollbar {
            width: 12px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 6px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--scrollbar-thumb-hover);
        }
    </style>
</head>
<body data-theme="dark">
    <button id="installButton"><i class="fas fa-download"></i> Install App</button>
    
    <button id="themeToggle" title="Toggle theme">
        <svg class="theme-icon" id="themeIcon" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="5"/>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
    </button>
    
    <div class="ai-voice-container">
        <button id="micButton" class="mic-button" type="button">
            <svg class="mic-icon" id="micIcon" viewBox="0 0 24 24">
                <path d="m12 1 3 3v6l-3 3-3-3V4l3-3Z"/>
                <path d="M19 10v1a7 7 0 0 1-14 0v-1"/>
                <line x1="12" y1="19" x2="12" y2="23"/>
                <line x1="8" y1="23" x2="16" y2="23"/>
            </svg>
            <div class="recording-square hidden" id="recordingSquare"></div>
        </button>

        <span class="timer idle" id="timer">00:00</span>

        <div class="visualizer-container" id="visualizerContainer">
            <!-- Bars will be generated by JavaScript -->
        </div>

        <div class="control-row">
            <p class="status-text" id="statusText">Click to speak</p>
            <button id="muteButton" class="mute-button hidden" type="button" aria-pressed="false">Mute mic</button>
        </div>
    </div>

    <div id="audioElements" class="audio-container hidden"></div>
    
    <script>
        // Theme management
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const body = document.body;

        // Check for saved theme preference or default to dark
        const savedTheme = localStorage.getItem('theme') || 'dark';
        body.setAttribute('data-theme', savedTheme);
        updateThemeIcon(savedTheme);

        function updateThemeIcon(theme) {
            if (theme === 'dark') {
                // Sun icon for switching to light
                themeIcon.innerHTML = `
                    <circle cx="12" cy="12" r="5"/>
                    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                `;
            } else {
                // Moon icon for switching to dark
                themeIcon.innerHTML = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>`;
            }
        }

        themeToggle.addEventListener('click', () => {
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        });

        // DOM Elements
        const micButton = document.getElementById('micButton');
        const micIcon = document.getElementById('micIcon');
        const recordingSquare = document.getElementById('recordingSquare');
        const timer = document.getElementById('timer');
        const visualizerContainer = document.getElementById('visualizerContainer');
        const statusText = document.getElementById('statusText');
        const audioElements = document.getElementById('audioElements');
        const muteButton = document.getElementById('muteButton');
        
        // Global variables
        let pc;
        let localStream;
        let audioElement = null;
        let audioContext;
        let analyser;
        let visualizerBars = [];
        const BAR_COUNT = 48;
        let icePollingInterval = null;
        let isRecording = false;
        let isConnecting = false;
        let startTime = null;
        let timerInterval = null;
        let manualStop = false;
        let reconnectAttempts = 0;
        let reconnectTimeout = null;
        const MAX_RECONNECT_DELAY = 10000;
        let isMuted = false;

        // Set up audio visualizer
        function setupVisualizer() {
            visualizerContainer.innerHTML = '';
            visualizerBars = [];
            
            for (let i = 0; i < BAR_COUNT; i++) {
                const bar = document.createElement('div');
                bar.className = 'visualizer-bar';
                visualizerContainer.appendChild(bar);
                visualizerBars.push(bar);
            }
        }
        
        // Update timer
        function updateTimer() {
            if (!startTime) return;
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            timer.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        // Start timer
        function startTimer() {
            startTime = Date.now();
            timerInterval = setInterval(updateTimer, 1000);
            timer.classList.remove('idle');
            timer.classList.add('recording');
        }

        // Stop timer
        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            startTime = null;
            timer.textContent = '00:00';
            timer.classList.remove('recording');
            timer.classList.add('idle');
        }

        // Update UI state
        function updateRecordingState(recording) {
            isRecording = recording;
            
            if (recording) {
                micButton.classList.add('recording');
                micIcon.classList.add('hidden');
                recordingSquare.classList.remove('hidden');
                statusText.textContent = 'Listening...';
                muteButton.classList.remove('hidden');
                startTimer();
                
                // Animate visualizer bars
                visualizerBars.forEach((bar, i) => {
                    bar.classList.add('recording');
                    bar.style.animationDelay = `${i * 0.05}s`;
                });
            } else {
                micButton.classList.remove('recording');
                micIcon.classList.remove('hidden');
                recordingSquare.classList.add('hidden');
                statusText.textContent = 'Click to speak';
                muteButton.classList.add('hidden');
                setMuteState(false);
                stopTimer();
                
                // Reset visualizer bars
                visualizerBars.forEach(bar => {
                    bar.classList.remove('recording');
                    bar.style.height = '2px';
                    bar.style.opacity = '0.15';
                });
            }
        }
        
        function clearReconnectTimer() {
            if (reconnectTimeout) {
                clearTimeout(reconnectTimeout);
                reconnectTimeout = null;
            }
        }

        function resetReconnectState() {
            reconnectAttempts = 0;
            clearReconnectTimer();
        }

        function scheduleReconnect() {
            if (manualStop) return;
            reconnectAttempts += 1;
            const delay = Math.min(1000 * Math.pow(2, reconnectAttempts - 1), MAX_RECONNECT_DELAY);
            statusText.textContent = `Reconnecting in ${Math.round(delay / 1000)}s...`;
            clearReconnectTimer();
            reconnectTimeout = setTimeout(() => {
                startStreaming();
            }, delay);
        }
        
        // Initialize audio visualizer
        function initAudioAnalyser(stream) {
            try {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                
                const source = audioContext.createMediaStreamSource(stream);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                source.connect(analyser);
                
                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);
                
                function updateVisualizer() {
                    if (!analyser || !isRecording) return;
                    
                    analyser.getByteFrequencyData(dataArray);
                    
                    // Update bars with more realistic audio visualization
                    for (let i = 0; i < BAR_COUNT; i++) {
                        const barIndex = Math.floor(i * bufferLength / BAR_COUNT);
                        const value = dataArray[barIndex];
                        
                        // Create more natural looking visualization
                        const baseHeight = 2;
                        const maxHeight = 16;
                        const randomFactor = 0.3 + Math.random() * 0.7;
                        const audioHeight = (value / 255) * maxHeight * randomFactor;
                        const finalHeight = Math.max(baseHeight, Math.min(audioHeight, maxHeight));
                        
                        visualizerBars[i].style.height = `${finalHeight}px`;
                        visualizerBars[i].style.opacity = Math.max(0.3, (value / 255) * 0.8 + 0.2);
                    }
                    
                    if (isRecording) {
                        requestAnimationFrame(updateVisualizer);
                    }
                }
                
                updateVisualizer();
            } catch (e) {
                // Silent fail for browsers that don't support AudioContext
                console.log('AudioContext not supported');
            }
        }
        
        // Automatically select the default audio output device
        async function setDefaultAudioOutput() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const outputDevices = devices.filter(device => device.kind === 'audiooutput');
                
                if (outputDevices.length > 0 && audioElement && typeof audioElement.setSinkId === 'function') {
                    await audioElement.setSinkId(outputDevices[0].deviceId);
                }
            } catch (e) {
                // Silent fail
            }
        }
        
        // Create a connection to the server to send the offer
        async function createOffer() {
            try {
                const response = await fetch('/offer', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        sdp: pc.localDescription.sdp,
                        type: pc.localDescription.type
                    })
                });

                const answer = await response.json();
                await pc.setRemoteDescription(new RTCSessionDescription(answer));
            } catch (e) {
                console.log('Failed to create offer:', e);
            }
        }

        // Example signaling function using fetch (adjust as needed)
        async function sendSignalingMessage(message) {
            await fetch('/ice', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(message)
            });
        }

        // Poll server for ICE candidates
        async function pollServerIceCandidates() {
            if (!pc) return;
            try {
                const response = await fetch('/get-ice');
                const data = await response.json();
                if (data.candidates && Array.isArray(data.candidates)) {
                    for (const c of data.candidates) {
                        if (c.candidate) {
                            try {
                                await pc.addIceCandidate({
                                    candidate: c.candidate,
                                    sdpMid: c.sdpMid,
                                    sdpMLineIndex: c.sdpMLineIndex
                                });
                            } catch (e) {
                                // Ignore errors for end-of-candidates
                            }
                        }
                    }
                }
            } catch (e) {
                // Silent fail
            }
        }

        // Start streaming
        async function startStreaming() {
            if (isConnecting || isRecording) {
                return;
            }

            try {
                statusText.textContent = 'Connecting...';
                manualStop = false;
                isConnecting = true;
                
                // Get user media (audio) with optimal settings for low latency
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        channelCount: 1,
                        sampleRate: 48000,
                        sampleSize: 16,
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true, 
                    },
                });
                
                // Initialize audio visualizer
                initAudioAnalyser(localStream);
                
                // Create RTCPeerConnection with optimized settings
                pc = new RTCPeerConnection({
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' },
                        { urls: 'stun:stun2.l.google.com:19302' },
                        { urls: 'stun:stun3.l.google.com:19302' },
                        { urls: 'stun:stun4.l.google.com:19302' }
                    ],
                    sdpSemantics: 'unified-plan',
                    bundlePolicy: 'max-bundle',
                    iceTransportPolicy: 'all'
                });

                // Handle connection state changes
                pc.oniceconnectionstatechange = () => {
                    if (pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed') {
                        isConnecting = false;
                        resetReconnectState();
                        updateRecordingState(true);
                        statusText.textContent = 'Connected';
                    } else if (pc.iceConnectionState === 'disconnected' || pc.iceConnectionState === 'failed') {
                        isConnecting = false;
                        updateRecordingState(false);
                        statusText.textContent = 'Connection lost. Reconnecting...';
                        
                        if (pc) {
                            pc.close();
                            pc = null;
                        }
                        if (icePollingInterval) {
                            clearInterval(icePollingInterval);
                            icePollingInterval = null;
                        }
                        if (localStream) {
                            localStream.getTracks().forEach(track => track.stop());
                            localStream = null;
                        }
                        if (audioElement) {
                            audioElement.remove();
                            audioElement = null;
                        }
                        scheduleReconnect();
                        
                        // Close existing connection
                    } else if (pc.iceConnectionState === 'closed') {
                        isConnecting = false;
                        updateRecordingState(false);
                        if (localStream) {
                            localStream.getTracks().forEach(track => track.stop());
                            localStream = null;
                        }
                        if (audioElement) {
                            audioElement.remove();
                            audioElement = null;
                        }
                        if (!manualStop) {
                            scheduleReconnect();
                        }
                    }
                };

                // Handle ICE candidates
                pc.onicecandidate = event => {
                    if (event.candidate) {
                        sendSignalingMessage({ type: 'ice', candidate: event.candidate });
                    }
                };

                // Handle incoming tracks
                pc.ontrack = async (event) => {
                    // Remove previous audio element if it exists
                    if (audioElement) {
                        audioElement.remove();
                    }

                    // Create new audio element (hidden)
                    audioElement = document.createElement('audio');
                    audioElement.srcObject = event.streams[0];
                    audioElement.autoplay = true;
                    audioElement.controls = false; // Remove controls
                    audioElement.style.display = 'none'; // Hide completely
                    
                    // Add to container but keep it hidden
                    audioElements.appendChild(audioElement);
                    
                    // Set default audio output
                    await setDefaultAudioOutput();
                };

                // Add local tracks to peer connection with high priority
                localStream.getTracks().forEach(track => {
                    const sender = pc.addTrack(track, localStream);
                    // Set high priority for audio tracks to minimize latency
                    if (sender.setParameters && sender.getParameters) {
                        const params = sender.getParameters();
                        if (params.encodings && params.encodings.length > 0) {
                            params.encodings[0].priority = 'high';
                            sender.setParameters(params);
                        }
                    }
                });

                // Create offer with latency optimization
                const offerOptions = {
                    offerToReceiveAudio: true,
                    offerToReceiveVideo: false,
                    voiceActivityDetection: false
                };
                
                const offer = await pc.createOffer(offerOptions);
                
                // Modify SDP to prefer opus codec with lower latency settings
                if (offer.sdp) {
                    offer.sdp = offer.sdp.replace(/(a=fmtp:111 .*)/g, '$1; useinbandfec=0; stereo=0; maxaveragebitrate=128000; maxplaybackrate=48000; ptime=10; minptime=10; maxptime=20');
                }
                
                await pc.setLocalDescription(offer);

                // Send offer to server
                await createOffer();
                
                // Start polling for server ICE candidates
                if (icePollingInterval) clearInterval(icePollingInterval);
                icePollingInterval = setInterval(pollServerIceCandidates, 500);
            } catch (error) {
                console.error('Failed to start streaming:', error);
                isConnecting = false;
                updateRecordingState(false);
                statusText.textContent = 'Failed to connect. Retrying...';
                if (pc) {
                    pc.close();
                    pc = null;
                }
                if (localStream) {
                    localStream.getTracks().forEach(track => track.stop());
                    localStream = null;
                }
                if (!manualStop) {
                    scheduleReconnect();
                }
            }
        }

        // Stop streaming
        async function stopStreaming() {
            try {
                manualStop = true;
                isConnecting = false;
                resetReconnectState();

                // Send stop signal to backend
                await fetch('/stop', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ stop: true })
                });

                // Clean up resources
                if (localStream) {
                    localStream.getTracks().forEach(track => {
                        track.stop();
                    });
                    localStream = null;
                }

                if (pc) {
                    pc.close();
                    pc = null;
                }
                
                if (analyser) {
                    analyser = null;
                }

                // Remove audio element
                if (audioElement) {
                    audioElement.remove();
                    audioElement = null;
                    // No need to hide container since it's always hidden now
                }
                
                // Stop polling for ICE candidates
                if (icePollingInterval) {
                    clearInterval(icePollingInterval);
                    icePollingInterval = null;
                }
                clearReconnectTimer();

                // Update UI state
                updateRecordingState(false);
            } catch (error) {
                console.error('Failed to stop streaming:', error);
            }
        }

        // Handle mic button click
        micButton.onclick = async () => {
            if (isRecording || isConnecting || reconnectTimeout) {
                await stopStreaming();
            } else {
                await startStreaming();
            }
        };

        function setMuteState(muted) {
            isMuted = muted;
            if (localStream) {
                localStream.getAudioTracks().forEach(track => {
                    track.enabled = !muted;
                });
            }
            muteButton.textContent = muted ? 'Unmute mic' : 'Mute mic';
            muteButton.setAttribute('aria-pressed', muted ? 'true' : 'false');
            muteButton.classList.toggle('active', muted);
        }

        muteButton.addEventListener('click', () => {
            // Only toggle when connected/recording
            if (!isRecording || !localStream) return;
            setMuteState(!isMuted);
        });
        
        // Initialize visualizer on page load
        setupVisualizer();
    </script>
    <script>
        let wakeLock = null;
        async function requestWakeLock() {
        try {
            wakeLock = await navigator.wakeLock.request('screen');
            console.log('Wake lock is active');

            // Re-acquire the wake lock if it's released (e.g., when screen turns off temporarily)
            wakeLock.addEventListener('release', () => {
            console.log('Wake lock was released');
            });
        } catch (err) {
            console.error(`${err.name}, ${err.message}`);
        }
        }
    </script>
    <script>
        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/static/sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful');
                    })
                    .catch(err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
    </script>
</body>
